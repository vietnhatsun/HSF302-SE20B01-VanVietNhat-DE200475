<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Error</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, Helvetica, sans-serif; background: #f4f6f9; color: #1c2530; margin: 0; }
        .container { max-width: 600px; margin: 50px auto; padding: 0 16px; }
        .panel { background: #fff; border-radius: 8px; padding: 24px; box-shadow: 0 1px 4px rgba(0,0,0,.08); text-align: center; }
        h2 { color: #c0392b; margin-top: 0; }
        .alert-danger { background: #f8d7da; color: #7a1f27; border: 1px solid #eec2c6; padding: 12px; border-radius: 4px; margin: 20px 0; }
        .btn { display: inline-block; padding: 8px 20px; border: 1px solid #1a5276; border-radius: 4px;
            background: #2471a3; color: #fff; text-decoration: none; cursor: pointer; font-size: 14px; }
        .btn:hover { background: #1a5276; }
    </style>
</head>
<body>
<div class="container">
    <div class="panel">
        <h2>An Error Occurred</h2>
        <div class="alert-danger" th:text="${errorMessage}">Something went wrong while processing your request. Please go back and try again.</div>
        <a th:href="@{/}" class="btn">Back to Home</a>
    </div>
</div>
</body>
</html>
