<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>500 - Lỗi máy chủ</title>
</head>
<body>
<section>
    <div class="row justify-content-center text-center my-5">
        <div class="col-md-7">
            <div class="card shadow-sm p-5 border-0">
                <div class="display-1 text-danger fw-bold mb-3">
                    <i class="bi bi-x-octagon-fill"></i> 500
                </div>
                <h3 class="mb-3">Lỗi xử lý nội bộ hệ thống</h3>
                <p class="text-muted" th:text="${errorMessage}">
                    Máy chủ gặp sự cố khi xử lý yêu cầu của bạn.
                </p>
                <div th:if="${errorDetail}" class="alert alert-danger text-start small border">
                    <strong>Thông báo lỗi:</strong> <span th:text="${errorDetail}"></span>
                </div>
                <div class="mt-4">
                    <a th:href="@{/students}" class="btn btn-primary px-4 me-2">
                        <i class="bi bi-arrow-left me-1"></i>Quay lại danh sách
                    </a>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
